name: GitHub Clone Count

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the 14-day traffic window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/traffic/clones" > clone_latest.json
          python3 -c "import json;d=json.load(open('clone_latest.json'));print('window:',d['count'],'clones /',d['uniques'],'uniques')"

      - name: Merge into the cumulative history
        run: python3 .github/clone-count/merge.py

      - name: Commit if the count moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .github/clone-count/clone.json; then
            echo "No change in clone count; nothing to commit."
            exit 0
          fi
          git add .github/clone-count/clone.json
          git commit -m "chore: update clone count [skip ci]"
          git push
