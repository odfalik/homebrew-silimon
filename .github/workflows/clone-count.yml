name: Install Count

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recompute the install count from release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: odfalik/silimon
        run: python3 .github/clone-count/merge.py

      - name: Commit if the count moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .github/clone-count/clone.json; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git add .github/clone-count/clone.json
          git commit -m "chore: update install count [skip ci]"
          git push
